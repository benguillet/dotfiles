[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = false

agent_panel_sort = "spaces"
[experimental]
pane_history = false

[theme]
name = "gruvbox"
auto_switch = false

[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"

[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "$local", fg = "#a6e3a1", bold = true },
    { token = "$remote", fg = "#89b4fa", bold = true },
    "workspace",
  ],
  ["branch", "git_status"],
  ["$worktree"],
]
